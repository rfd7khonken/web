<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | สจป.7</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="container">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="brand-mark mx-auto mb-3">7</div>
            <h2 class="fw-bold">เข้าสู่ระบบ</h2>
            <p class="text-secondary mb-0">ระบบจัดการเว็บไซต์ สจป.7 (ขอนแก่น)</p>
          </div>
          <div id="loginAlert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">ชื่อผู้ใช้</label>
              <input id="username" class="form-control form-control-lg" autocomplete="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label">รหัสผ่าน</label>
              <input id="password" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
            </div>
            <button id="loginBtn" class="btn btn-success btn-lg w-100">เข้าสู่ระบบ</button>
          </form>
          <div class="text-center mt-4"><a href="index.html" class="text-decoration-none">← กลับหน้าเว็บไซต์</a></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
