<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Khonkaen Forest Digital Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark forest-nav">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html">Khonkaen Forest Digital Service Admin</a>
    <div class="d-flex align-items-center gap-3 text-white">
      <span id="currentUser" class="small"></span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">ออกจากระบบ</button>
    </div>
  </div>
</nav>
<div class="container-fluid p-4">
  <div class="mb-4"><h1 class="h3 fw-bold">Dashboard</h1><p class="text-secondary">ภาพรวมระบบประชาสัมพันธ์และเอกสาร</p></div>
  <div id="dashboardAlert"></div>
  <div class="row g-4 mb-4">
    <div class="col-md-3"><div class="stat-card"><div class="stat-label">ข่าวประชาสัมพันธ์</div><div id="statNews" class="stat-value">-</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="stat-label">เอกสาร</div><div id="statDocs" class="stat-value">-</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="stat-label">ผู้ใช้งาน</div><div id="statUsers" class="stat-value">-</div></div></div>
    <div class="col-md-3"><div class="stat-card"><div class="stat-label">สถานะระบบ</div><div class="stat-value text-success fs-4">Online</div></div></div>
  </div>
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm"><div class="card-body">
        <h5 class="fw-bold">ข่าวล่าสุด</h5>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>หัวข้อ</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody id="latestNews"></tbody></table></div>
      </div></div>
    </div>
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm"><div class="card-body">
        <h5 class="fw-bold">เมนูจัดการ</h5>
        <div class="d-grid gap-2">
          <button class="btn btn-outline-success" disabled>จัดการข่าว</button>
          <button class="btn btn-outline-success" disabled>จัดการเอกสาร</button>
          <button class="btn btn-outline-success" disabled>จัดการผู้ใช้</button>
          <button class="btn btn-outline-success" disabled>จัดการหน้าเว็บ</button>
        </div>
        <p class="small text-secondary mt-3 mb-0">MVP นี้เตรียม API และโครงสร้างไว้สำหรับเพิ่ม CRUD ในขั้นถัดไป</p>
      </div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/dashboard.js"></script>
</body>
</html>
